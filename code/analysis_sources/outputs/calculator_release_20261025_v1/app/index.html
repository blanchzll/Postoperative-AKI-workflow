<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>围术期 AKI 风险研究计算器</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans CJK SC",sans-serif;color:#163349;background:#f2f6f8}
*{box-sizing:border-box}body{margin:0}main{max-width:1080px;margin:auto;padding:30px 24px 60px}header{margin:0 0 24px}.eyebrow{color:#287777;letter-spacing:.12em;font-size:13px}h1{font-size:28px;margin:10px 0}p{line-height:1.6;color:#526776}.panel{background:white;border:1px solid #dbe4e9;border-radius:14px;padding:24px;margin:16px 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:20px}.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.field label{display:block;font-size:14px;font-weight:600;margin-bottom:7px}.unit{font-size:12px;font-weight:400;color:#617c89}input,select{font:inherit;width:100%;padding:11px;border:1px solid #c5d3db;border-radius:7px;background:white;color:#163349}input:focus,select:focus{outline:2px solid #46a5a1;outline-offset:1px}.hint{font-size:13px;color:#607583}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}button{font:inherit;border:0;border-radius:7px;padding:12px 22px;cursor:pointer;color:white;background:#176b70}button.secondary{background:#e9f0f3;color:#234956}button:disabled{opacity:.5;cursor:wait}.risk{font-size:46px;font-weight:700;color:#176b70;margin:12px 0}.tag{display:inline-block;background:#e8f3f1;padding:7px 11px;border-radius:6px;font-size:14px}.error{background:#fff0ed;color:#963d2c;padding:14px;border-radius:7px}.resultgrid{display:grid;grid-template-columns:1fr 1fr;gap:24px}.small{font-size:13px}footer{font-size:12px;color:#70828c;margin-top:24px}[hidden]{display:none!important}@media(max-width:700px){main{padding:20px 16px}.fields{grid-template-columns:1fr 1fr}.row,.resultgrid{grid-template-columns:1fr}h1{font-size:24px}.panel{padding:18px}}@media(max-width:420px){.fields{grid-template-columns:1fr}}
</style>
<main>
<header><div class="eyebrow">PERIOPERATIVE KIDNEY RISK · RESEARCH</div><h1>围术期 AKI 风险研究计算器</h1><p>成人择期胃肠肿瘤手术人群 · 术前评估与术毕风险更新</p></header>
<section class="panel"><div class="row"><div class="field"><label for="route">模型路线</label><select id="route"></select></div><div class="field"><label for="case">匿名就诊键</label><input id="case" maxlength="128" autocomplete="off" value="research_case_001"></div></div><p class="hint">同次就诊请保持匿名键一致，以保持缺失值补全一致。请勿输入姓名或住院号。</p><div class="field"><label for="rule">预警规则</label><select id="rule"><option value="training_capacity20">源训练20%复核容量对应阈值</option><option value="training_capacity10">源训练10%复核容量对应阈值</option><option value="training_sensitivity80">源训练80%敏感度对应阈值</option></select></div><p class="hint">迁移后实际复核率和敏感度可能变化。此处输出风险分层，供研究评估。</p></section>
<form class="panel" id="form"><h2 style="font-size:18px;margin-top:0">临床输入</h2><p class="hint">按标注单位输入；确实缺失的项目留空，由原训练插补器处理。</p><div class="fields" id="fields"></div><div class="actions"><button id="calculate" type="submit">计算风险</button><button id="example" type="button" class="secondary">填写模拟示例</button><button id="clear" type="button" class="secondary">清空</button></div></form>
<div id="error" class="error" role="alert" hidden></div>
<section class="panel" id="result" aria-live="polite" hidden><div class="resultgrid"><div><div class="hint" id="modelName"></div><div class="risk" id="risk"></div><div class="tag" id="alert"></div></div><div><p id="threshold"></p><p class="small" id="missing"></p><p class="small">预警结果不代表AKI诊断或干预疗效。请结合临床检查判断。</p></div></div></section>
<footer>原冻结模型与源校准流程 · <span id="version"></span> · 数据仅发送至当前服务器，不写入计算日志。</footer>
</main>
<script>
let catalog,last=null;
const $=id=>document.getElementById(id);
const defaults={Age:65,Sex:"1",PreopHospitalDays:2,Height:170,Weight:65,BMI:22.49,WeightLoss:0,PreopWBC:6,PreopHb:130,PreopAlb:40,PreopALT:25,PreopBUN:5.5,PreopCr:80,PreopGlucose:5.6,OperationTime:180,IntraopBloodLoss:100,IntraopTransfusion:0,IntraopFluid:1500,IntraopHES:0,IntraopDextran:0,IntraopGelatin:0,IntraopPlasma:0,TumorSite:"0",TumorGroup:"1",PreviousAbdominalSurgery:"0",OtherMalignancy:"0",Comorbidities:"0",Diabetes:"0",Hypertension:"0",CerebrovascularDisease:"0",HeartDisease:"0",Smoking:"0",Alcohol:"0",NeoadjuvantChemo:"0",ASA:"2",SurgicalApproach:"2",IntraopDiuretics:"0",IntraopVasoactive:"0"};
function resetResult(){last=null;$("result").hidden=true;$("error").hidden=true;}
function renderFields(){resetResult();const r=catalog.routes[$("route").value];$("fields").replaceChildren();for(const f of r.fields){const div=document.createElement("div");div.className="field";const label=document.createElement("label");label.htmlFor="f_"+f.name;label.textContent=f.label;if(f.unit){const unit=document.createElement("span");unit.className="unit";unit.textContent=" · "+f.unit;label.append(unit)}let input;if(f.type==="category"){input=document.createElement("select");const opt=new Option("缺失 / 未知","");input.add(opt);for(const v of f.allowed)input.add(new Option((f.labels[v]||v)+" ["+v+"]",v));}else{input=document.createElement("input");input.type="number";input.step="any";input.placeholder="缺失留空";if(f.lower!==undefined)input.min=f.lower;if(f.upper!==undefined)input.max=f.upper;}input.id="f_"+f.name;input.addEventListener("input",resetResult);div.append(label,input);$("fields").append(div);}}
function showResult(){if(!last)return;const row=last.predictions[0],rule=$("rule").value;$("modelName").textContent=catalog.routes[last.route].label;$("risk").textContent=(row.risk*100).toFixed(2)+"%";$("alert").textContent=row.alerts[rule]?"达到所选预警阈值":"未达到所选预警阈值";$("threshold").textContent="当前固定风险阈值："+(last.thresholds[rule]*100).toFixed(3)+"%";$("missing").textContent="由原插补器补全："+row.missing_fields.length+" 项"+(row.missing_fields.length?"（"+row.missing_fields.map(n=>catalog.routes[last.route].fields.find(f=>f.name===n).label).join("、")+"）":"");$("result").hidden=false;}
$("route").addEventListener("change",renderFields);$("rule").addEventListener("change",showResult);$("case").addEventListener("input",resetResult);
$("example").addEventListener("click",()=>{for(const f of catalog.routes[$("route").value].fields)$("f_"+f.name).value=defaults[f.name]??"";$("case").value="DEMO_case_001";resetResult();});
$("clear").addEventListener("click",()=>{for(const f of catalog.routes[$("route").value].fields)$("f_"+f.name).value="";resetResult();});
$("form").addEventListener("submit",async e=>{e.preventDefault();resetResult();const route=$("route").value,rec={case_key:$("case").value},units={};for(const f of catalog.routes[route].fields){const v=$("f_"+f.name).value;rec[f.name]=v===""?null:f.type==="number"?Number(v):v;if(f.unit)units[f.name]=f.unit;}$("calculate").disabled=true;try{const res=await fetch("/api/predict",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({route,units,records:[rec]})});const q=await res.json();if(!res.ok)throw new Error(q.error||"计算未完成");last=q;showResult();}catch(err){$("error").textContent=err.message;$("error").hidden=false;}finally{$("calculate").disabled=false;}});
fetch("/api/catalog").then(r=>r.json()).then(q=>{catalog=q;$("version").textContent=q.version;for(const [k,v] of Object.entries(q.routes))$("route").add(new Option(v.label,k));$("route").value="geography_preop_preop_compact";renderFields();}).catch(()=>{$("error").textContent="无法加载研究模型目录";$("error").hidden=false;});
</script></html>
